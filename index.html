<!doctype html>
<html lang="it">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#f5f1eb">
<link rel="manifest" href="manifest.json">
<title>MyOutfit</title>
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#f5f1eb;--card:#fff;--ink:#181715;--muted:#7a746d;--line:#e5ddd4;--dark:#222;--good:#4d7757}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
body{margin:0;background:var(--bg);color:var(--ink);font-family:-apple-system,BlinkMacSystemFont,"SF Pro Text","Helvetica Neue",Arial,sans-serif}
.app{max-width:520px;margin:auto;min-height:100vh;padding:calc(16px + env(safe-area-inset-top)) 16px calc(40px + env(safe-area-inset-bottom))}
header{display:flex;align-items:center;justify-content:space-between;margin-bottom:18px}
.brand{font:31px Georgia,serif}.pill{border:0;border-radius:999px;background:#ebe4dc;padding:9px 13px}
.card{background:var(--card);border:1px solid var(--line);border-radius:24px;padding:18px;margin-bottom:14px;box-shadow:0 8px 25px rgba(30,20,10,.04)}
h1,h2{font-family:Georgia,serif;font-weight:500;margin:0 0 10px}h1{font-size:30px}h2{font-size:24px}
p{color:var(--muted);line-height:1.45}
input,select{width:100%;border:1px solid var(--line);background:#fff;border-radius:14px;padding:13px 14px;font-size:16px;margin:6px 0}
button{font:inherit}.btn{width:100%;border:0;border-radius:15px;padding:14px 16px;font-weight:650;margin-top:8px}
.dark{background:var(--dark);color:#fff}.soft{background:#ede7df;color:#222}
.row{display:flex;gap:10px}.row>*{flex:1}
.hide{display:none!important}.muted{color:var(--muted);font-size:14px}.code{font:700 22px ui-monospace,monospace;letter-spacing:.12em}
.item{display:flex;gap:13px;align-items:center;border-top:1px solid var(--line);padding:13px 0}.item:first-child{border-top:0}
.photo{width:78px;height:92px;border-radius:16px;background:#efe9e2;object-fit:cover;display:grid;place-items:center;font-size:32px}
.grow{flex:1}.tag{display:inline-block;background:#eee8e0;border-radius:999px;padding:5px 9px;font-size:12px;margin-top:5px}
.status{padding:11px 13px;border-radius:12px;background:#eee8e0;margin-top:10px;font-size:14px}.ok{background:#e5efe7;color:#33583b}
.small{font-size:13px}.section{margin-top:20px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand">MyOutfit</div>
  <button id="logoutBtn" class="pill hide" onclick="logout()">Esci</button>
</header>

<section id="authView">
  <div class="card">
    <h1>Il tuo armadio, condiviso.</h1>
    <p>Accedi per provare il database reale e caricare foto dei tuoi capi.</p>
    <input id="email" type="email" placeholder="Email">
    <input id="password" type="password" placeholder="Password (min. 6 caratteri)">
    <button class="btn dark" onclick="login()">Accedi</button>
    <button class="btn soft" onclick="signup()">Crea account</button>
    <div id="authStatus" class="status hide"></div>
  </div>
</section>

<section id="mainView" class="hide">
  <div class="card">
    <h2 id="wardrobeName">Il mio armadio</h2>
    <div class="muted">Codice condivisione</div>
    <div id="shareCode" class="code">—</div>
    <div class="row">
      <input id="joinCode" placeholder="Codice di un altro armadio">
      <button class="pill" onclick="joinWardrobe()">Unisciti</button>
    </div>
  </div>

  <div class="card">
    <h2>Aggiungi un capo</h2>
    <input id="itemName" placeholder="Nome, es. Camicia azzurra">
    <div class="row">
      <select id="category">
        <option value="">Categoria</option><option>Camicia</option><option>Maglia</option><option>Pantalone</option><option>Giacca</option><option>Scarpe</option><option>Accessorio</option>
      </select>
      <input id="color" placeholder="Colore">
    </div>
    <select id="season">
      <option value="">Stagione</option><option>Tutto l'anno</option><option>Primavera</option><option>Estate</option><option>Autunno</option><option>Inverno</option>
    </select>
    <input id="photoInput" type="file" accept="image/*" capture="environment">
    <button class="btn dark" onclick="addClothing()">Salva capo + foto</button>
    <div id="saveStatus" class="status hide"></div>
  </div>

  <div class="section">
    <h2>Il mio armadio</h2>
    <div id="items" class="card"><div class="muted">Nessun capo ancora.</div></div>
  </div>
</section>
</div>

<script>
const SUPABASE_URL="https://bqdwkxxdkoimqvyuuijz.supabase.co";
const SUPABASE_KEY="sb_publishable_waNH0xJIs-giJ7YNsXV-sw_t_H_UtS5";
const sb=window.supabase.createClient(SUPABASE_URL,SUPABASE_KEY);
let currentUser=null,currentWardrobe=null;

function setStatus(id,msg,ok=false){
  const el=document.getElementById(id); el.textContent=msg; el.classList.remove("hide","ok"); if(ok) el.classList.add("ok");
}
async function signup(){
  const email=document.getElementById("email").value.trim(), password=document.getElementById("password").value;
  const {data,error}=await sb.auth.signUp({email,password});
  if(error) return setStatus("authStatus",error.message);
  if(data.session){ setStatus("authStatus","Account creato.",true); await boot(); }
  else setStatus("authStatus","Account creato. Controlla l'email per confermare, poi accedi.",true);
}
async function login(){
  const email=document.getElementById("email").value.trim(), password=document.getElementById("password").value;
  const {error}=await sb.auth.signInWithPassword({email,password});
  if(error) return setStatus("authStatus",error.message);
  await boot();
}
async function logout(){ await sb.auth.signOut(); location.reload(); }

async function boot(){
  const {data:{user}}=await sb.auth.getUser();
  if(!user){document.getElementById("authView").classList.remove("hide");return}
  currentUser=user;
  document.getElementById("authView").classList.add("hide");
  document.getElementById("mainView").classList.remove("hide");
  document.getElementById("logoutBtn").classList.remove("hide");
  await ensureWardrobe();
  await loadItems();
}
async function ensureWardrobe(){
  let {data,error}=await sb.from("wardrobes").select("*").order("created_at",{ascending:true}).limit(1);
  if(error){alert(error.message);return}
  if(!data.length){
    const r=await sb.from("wardrobes").insert({owner_id:currentUser.id,name:"Il mio armadio"}).select().single();
    if(r.error){alert(r.error.message);return}
    currentWardrobe=r.data;
  } else currentWardrobe=data[0];
  document.getElementById("wardrobeName").textContent=currentWardrobe.name;
  document.getElementById("shareCode").textContent=currentWardrobe.share_code;
}
async function joinWardrobe(){
  const code=document.getElementById("joinCode").value.trim();
  if(!code)return;
  const {data,error}=await sb.rpc("join_wardrobe_by_code",{p_code:code});
  if(error){alert(error.message);return}
  const r=await sb.from("wardrobes").select("*").eq("id",data).single();
  if(r.error){alert(r.error.message);return}
  currentWardrobe=r.data;
  document.getElementById("wardrobeName").textContent=currentWardrobe.name;
  document.getElementById("shareCode").textContent=currentWardrobe.share_code;
  await loadItems();
}
async function addClothing(){
  if(!currentWardrobe)return;
  const name=document.getElementById("itemName").value.trim();
  if(!name)return setStatus("saveStatus","Inserisci un nome.");
  const file=document.getElementById("photoInput").files[0];
  let imagePath=null;
  try{
    if(file){
      const ext=(file.name.split(".").pop()||"jpg").toLowerCase();
      imagePath=currentWardrobe.id+"/"+crypto.randomUUID()+"."+ext;
      const up=await sb.storage.from("clothes-images").upload(imagePath,file,{upsert:false});
      if(up.error)throw up.error;
    }
    const ins=await sb.from("clothes").insert({
      wardrobe_id:currentWardrobe.id,created_by:currentUser.id,name,
      category:document.getElementById("category").value||null,
      color:document.getElementById("color").value||null,
      season:document.getElementById("season").value||null,
      image_path:imagePath
    });
    if(ins.error)throw ins.error;
    document.getElementById("itemName").value="";
    document.getElementById("color").value="";
    document.getElementById("photoInput").value="";
    setStatus("saveStatus","Capo salvato nel database.",true);
    await loadItems();
  }catch(e){setStatus("saveStatus",e.message||String(e))}
}
async function loadItems(){
  const box=document.getElementById("items");
  const {data,error}=await sb.from("clothes").select("*").eq("wardrobe_id",currentWardrobe.id).order("created_at",{ascending:false});
  if(error){box.innerHTML="<div class='muted'>"+escapeHtml(error.message)+"</div>";return}
  if(!data.length){box.innerHTML="<div class='muted'>Nessun capo ancora.</div>";return}
  const rows=[];
  for(const item of data){
    let url="";
    if(item.image_path){
      const s=await sb.storage.from("clothes-images").createSignedUrl(item.image_path,3600);
      if(!s.error)url=s.data.signedUrl;
    }
    rows.push(`<div class="item">
      ${url?`<img class="photo" src="${url}" alt="">`:`<div class="photo">👕</div>`}
      <div class="grow"><b>${escapeHtml(item.name)}</b><div class="muted">${escapeHtml(item.category||"Senza categoria")} · ${escapeHtml(item.color||"—")}</div><span class="tag">${item.available?"Disponibile":"Non disponibile"}</span></div>
    </div>`);
  }
  box.innerHTML=rows.join("");
}
function escapeHtml(s){return String(s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#039;"}[c]))}
sb.auth.onAuthStateChange((_event,session)=>{if(session?.user&&!currentUser)boot()});
boot();
if("serviceWorker" in navigator)window.addEventListener("load",()=>navigator.serviceWorker.register("sw.js"));
</script>
</body>
</html>
